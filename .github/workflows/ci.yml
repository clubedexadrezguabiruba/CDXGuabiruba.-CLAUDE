name: CI

# Por que este workflow existe:
#
# O projeto tem uma cadeia de gates de verificação (npm run verify:all) que só rodavam se
# alguém lembrasse de rodá-los. Foi exatamente assim que a curva de XP ficou
# revertida por 4 meses em produção sem ninguém notar. O CI tira o "lembrar" da
# equação.
#
# O e2e (npx playwright test) NÃO está aqui de propósito: ele cria e deleta
# usuários reais no Supabase de PRODUÇÃO via admin API (e2e/puzzles.spec.ts,
# e2e/helpers/class-helpers.ts). Rodar a cada push bateria em produção.
# Pré-requisito para incluí-lo um dia: um projeto Supabase separado para teste.

on:
  push:
    branches: [main]
  pull_request:

# Um run por ref: push seguido cancela o anterior em vez de enfileirar.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # O postinstall (scripts/setup-stockfish.ts) só COPIA de
      # node_modules/stockfish/bin para public/stockfish/ — não baixa nada da
      # rede, então não é ponto de flakiness.
      - name: Instalar dependências
        run: npm ci

      # Confere a FORMA dos 4 secrets (nunca o valor) antes de qualquer coisa
      # depender deles. Sem isto, um secret mal colado só estoura lá no
      # verify:all, com erro de dentro do node_modules que não diz qual variável
      # é a culpada.
      - name: Conferir variáveis de ambiente
        run: npx tsx scripts/verify/env-shape.ts

      # Só o Chromium, e só porque o verify:pose precisa dele: aquele gate
      # rasteriza o SVG do avatar e mede a silhueta em pixel contra a
      # referência. É o único gate que abre navegador. Sem este passo o
      # verify:all quebra no fim de um run que já gastou dois minutos.
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes unitários
        run: npm test

      - name: Build
        run: npm run build

      # A cadeia inteira do verify:all, e é a razão de existir deste workflow.
      # A maioria toca o banco remoto (leitura + fixtures próprias). Os que NÃO
      # tocam banco: verify:no-dup-rpc (lê as migrations), verify:paleta-patentes
      # (lê os SVGs), verify:curriculo (lê o markdown), verify:design-tokens (lê
      # globals.css e src/) e verify:pose — este abre o Chromium, rasteriza o
      # SVG do avatar e mede a silhueta em pixel contra a referência.
      #
      # Sem contagem aqui de propósito: o número já apodreceu duas vezes.
      #
      # verify:phase8 (avatar) abre 60 baús de verdade para provar que todo
      # item sorteado aparece no boneco. Roda dentro de uma transação com
      # ROLLBACK e personifica um usuário existente via request.jwt.claims —
      # nenhuma linha sobrevive, por isso pode rodar em CI, ao contrário do
      # e2e, que cria e apaga contas reais.
      - name: Gates de verificação
        run: npm run verify:all
