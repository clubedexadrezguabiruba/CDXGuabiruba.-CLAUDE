<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <title>Recruta V1 — Hand Mask (unisex)</title>
  <defs>
    <style>
      .canvas { fill: #f5f5f5; stroke: #ccc; stroke-width: 1; }
      .excluded { fill: rgba(0,0,0,0.05); }
      .hand-region { fill: rgba(100,255,100,0.2); stroke: #27ae60; stroke-width: 2; }
      .label { font-family: sans-serif; font-size: 11px; font-weight: bold; fill: #27ae60; }
      .note { font-family: sans-serif; font-size: 9px; fill: #666; }
    </style>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="400" height="560" class="canvas" />

  <!-- Excluded areas -->
  <rect x="0" y="0" width="400" height="179.2" class="excluded" />
  <rect x="0" y="319.2" width="400" height="240.8" class="excluded" />
  <rect x="0" y="179.2" width="68" height="140" class="excluded" />
  <rect x="168" y="179.2" width="232" height="140" class="excluded" />

  <!-- Hand region: x=68, y=179.2, w=100, h=140 -->
  <rect x="68" y="179.2" width="100" height="140" class="hand-region" rx="4" />

  <!-- Labels -->
  <text x="118" y="240" text-anchor="middle" class="label">HAND REGION</text>
  <text x="118" y="255" text-anchor="middle" class="note">x=68 y=179 w=100 h=140</text>
  <text x="118" y="270" text-anchor="middle" class="note">Asset canvas: 512×512</text>
  <text x="118" y="285" text-anchor="middle" class="note">Same for male &amp; female</text>

  <text x="200" y="400" text-anchor="middle" class="note">Character's right hand = left side of screen</text>
  <text x="200" y="415" text-anchor="middle" class="note">origin: top center (swings from shoulder)</text>
</svg>
