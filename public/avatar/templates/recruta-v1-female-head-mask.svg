<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <title>Recruta V1 — Female Head Mask</title>
  <defs>
    <style>
      .canvas { fill: #f5f5f5; stroke: #ccc; stroke-width: 1; }
      .excluded { fill: rgba(0,0,0,0.05); }
      .head-region { fill: rgba(255,100,100,0.2); stroke: #e74c3c; stroke-width: 2; }
      .jawline { stroke: #e74c3c; stroke-width: 1.5; stroke-dasharray: 4,3; }
      .label { font-family: sans-serif; font-size: 11px; font-weight: bold; fill: #e74c3c; }
      .note { font-family: sans-serif; font-size: 9px; fill: #666; }
    </style>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="400" height="560" class="canvas" />

  <!-- Excluded areas -->
  <rect x="0" y="0" width="400" height="54.9" class="excluded" />
  <rect x="0" y="183.7" width="400" height="376.3" class="excluded" />
  <rect x="0" y="54.9" width="15.6" height="128.8" class="excluded" />
  <rect x="383.6" y="54.9" width="16.4" height="128.8" class="excluded" />

  <!-- Head region female: x=15.6, y=54.9, w=368, h=128.8 -->
  <rect x="15.6" y="54.9" width="368" height="128.8" class="head-region" rx="4" />

  <!-- Jawline indicator -->
  <line x1="15.6" y1="183.7" x2="383.6" y2="183.7" class="jawline" />

  <!-- Labels -->
  <text x="200" y="105" text-anchor="middle" class="label">HEAD REGION (female)</text>
  <text x="200" y="120" text-anchor="middle" class="note">x=16 y=55 w=368 h=129</text>
  <text x="200" y="135" text-anchor="middle" class="note">Asset canvas: 1024×1024</text>
  <text x="200" y="150" text-anchor="middle" class="note">Wider region: longer hair needs more space</text>
  <text x="200" y="200" text-anchor="middle" class="note">--- Jawline cut (no neck below) ---</text>
</svg>
