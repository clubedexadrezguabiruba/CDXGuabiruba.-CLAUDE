<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <title>Recruta V1 — Male Head Mask</title>
  <defs>
    <style>
      .canvas { fill: #f5f5f5; stroke: #ccc; stroke-width: 1; }
      .excluded { fill: rgba(0,0,0,0.05); }
      .head-region { fill: rgba(255,100,100,0.2); stroke: #e74c3c; stroke-width: 2; }
      .jawline { stroke: #e74c3c; stroke-width: 1.5; stroke-dasharray: 4,3; }
      .label { font-family: sans-serif; font-size: 11px; font-weight: bold; fill: #e74c3c; }
      .note { font-family: sans-serif; font-size: 9px; fill: #666; }
    </style>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="400" height="560" class="canvas" />

  <!-- Excluded areas (dimmed) -->
  <rect x="0" y="0" width="400" height="53.2" class="excluded" />
  <rect x="0" y="173.6" width="400" height="386.4" class="excluded" />
  <rect x="0" y="53.2" width="40" height="120.4" class="excluded" />
  <rect x="360" y="53.2" width="40" height="120.4" class="excluded" />

  <!-- Head region: x=40, y=53.2, w=320, h=120.4 -->
  <rect x="40" y="53.2" width="320" height="120.4" class="head-region" rx="4" />

  <!-- Jawline indicator (cut here, no neck) -->
  <line x1="40" y1="173.6" x2="360" y2="173.6" class="jawline" />

  <!-- Labels -->
  <text x="200" y="105" text-anchor="middle" class="label">HEAD REGION (male)</text>
  <text x="200" y="120" text-anchor="middle" class="note">x=40 y=53 w=320 h=120</text>
  <text x="200" y="135" text-anchor="middle" class="note">Asset canvas: 1024×1024</text>
  <text x="200" y="190" text-anchor="middle" class="note">--- Jawline cut (no neck below) ---</text>
  <text x="200" y="250" text-anchor="middle" class="note">Draw full head (hair + face + accessory)</text>
  <text x="200" y="265" text-anchor="middle" class="note">centered at ~60-70% of 1024×1024 asset</text>
</svg>
