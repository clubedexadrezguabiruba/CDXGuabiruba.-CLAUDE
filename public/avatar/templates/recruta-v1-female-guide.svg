<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <title>Recruta V1 — Female Template Guide</title>
  <defs>
    <style>
      .canvas-border { fill: none; stroke: #333; stroke-width: 2; stroke-dasharray: 8,4; }
      .body-region { fill: rgba(100,180,255,0.1); stroke: #4a90d9; stroke-width: 1.5; stroke-dasharray: 6,3; }
      .head-region { fill: rgba(255,100,100,0.15); stroke: #e74c3c; stroke-width: 2; }
      .hand-region { fill: rgba(100,255,100,0.15); stroke: #27ae60; stroke-width: 2; }
      .pet-region { fill: rgba(255,200,50,0.15); stroke: #f39c12; stroke-width: 2; }
      .ground-line { stroke: #8b4513; stroke-width: 1.5; stroke-dasharray: 10,5; }
      .label { font-family: sans-serif; font-size: 11px; font-weight: bold; }
      .sublabel { font-family: sans-serif; font-size: 9px; fill: #666; }
      .dimension { font-family: monospace; font-size: 8px; fill: #999; }
    </style>
  </defs>

  <!-- Canvas boundary -->
  <rect x="0" y="0" width="400" height="560" class="canvas-border" />

  <!-- Body region (93% canvas, bottom-anchored, center-x) -->
  <rect x="14" y="39.2" width="372" height="520.8" class="body-region" />
  <text x="200" y="30" text-anchor="middle" class="label" fill="#4a90d9">BODY REGION</text>
  <text x="200" y="42" text-anchor="middle" class="dimension">372×521 (93% canvas)</text>

  <!-- Ground line at 95% = y=532 -->
  <line x1="0" y1="532" x2="400" y2="532" class="ground-line" />
  <text x="395" y="528" text-anchor="end" class="sublabel" fill="#8b4513">Ground Line y=532 (95%)</text>

  <!-- Head region female: x=15.6, y=54.88, w=368, h=128.8 -->
  <rect x="15.6" y="54.9" width="368" height="128.8" class="head-region" rx="4" />
  <text x="200" y="72" text-anchor="middle" class="label" fill="#e74c3c">HEAD (female)</text>
  <text x="200" y="85" text-anchor="middle" class="dimension">368×129 | top:0.098 left:0.039 w:0.92 h:0.230</text>
  <text x="200" y="97" text-anchor="middle" class="sublabel" fill="#e74c3c">origin: bottom center | Wider for longer hair</text>

  <!-- Hand region: x=68, y=179.2, w=100, h=140 (same for both genders) -->
  <rect x="68" y="179.2" width="100" height="140" class="hand-region" rx="4" />
  <text x="118" y="195" text-anchor="middle" class="label" fill="#27ae60">HAND</text>
  <text x="118" y="208" text-anchor="middle" class="dimension">100×140</text>
  <text x="118" y="220" text-anchor="middle" class="sublabel" fill="#27ae60">origin: top center</text>

  <!-- Pet region -->
  <rect x="253" y="366.6" width="143" height="143" class="pet-region" rx="4" />
  <text x="324" y="430" text-anchor="middle" class="label" fill="#f39c12">PET</text>
  <text x="324" y="443" text-anchor="middle" class="dimension">~143×143 (xl ref)</text>

  <!-- Canvas label -->
  <text x="200" y="555" text-anchor="middle" class="sublabel">Canvas: 400×560 (runtime) | Ratio: 5:7</text>
</svg>
